
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.2.2
    restart: unless-stopped
    environment:
      DB_HOSTNAME: database
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      TZ: Asia/Kolkata
    volumes:
      - /srv/photos/immich:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - reverse-proxy

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    networks:
      - default

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - /srv/docker/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: >-
        pg_isready --dbname=immich --username=postgres ||
        exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  model-cache:

networks:
  default:
    driver: bridge
  reverse-proxy:
    external: true
    name: reverse-proxy
