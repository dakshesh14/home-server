
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls280
    container_name: sabnzbd
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./sabnzbd_config:/config
      - /srv/media:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls167
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./prowlarr_config:/config

  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./radarr_config:/config
      - /srv/media:/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./sonarr_config:/config
      - /srv/media:/data

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.5
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./bazarr_config:/config
      - /srv/media:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    tmpfs:
      - /tmp:size=256M,mode=1777
